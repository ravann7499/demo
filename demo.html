

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium Live Stream Player">
    <meta name="theme-color" content="#0f172a">
    <title>TG:@streamxcricket</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Dark Premium Theme */
            --bg-deep: #0f172a;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            
            /* Glassmorphism Surface */
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(139, 92, 246, 0.2);
            --glass-blur: blur(20px);
            --glass-shadow: 0 10px 40px -10px rgba(139, 92, 246, 0.3);

            /* Accents */
            --accent-primary: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --accent-secondary: #06b6d4;
            
            /* Text */
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            
            /* Status */
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(99, 102, 241, 0.1) 0%, transparent 40%);
            z-index: -1;
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            width: 100%;
            max-width: 1100px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* --- Header Styling --- */
        .stream-header {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 1.25rem 2rem;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }

        .stream-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.1), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .stream-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f1f5f9 0%, #a78bfa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .live-badge {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.5rem 1.25rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px var(--danger-glow);
            letter-spacing: 1.5px;
            position: relative;
            z-index: 1;
        }

        .live-badge i { font-size: 0.6rem; animation: pulseRed 2s infinite; }
        
        @keyframes pulseRed {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        /* --- Player Styling --- */
        #player-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 25px 60px -15px rgba(99, 102, 241, 0.4), inset 0 0 30px rgba(99, 102, 241, 0.1);
            position: relative;
            z-index: 10;
        }

        #player-container iframe {
            pointer-events: auto !important;
        }

        /* --- Grid Panels --- */
        .grid-panels {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            margin-top: 1.5rem;
        }

        .info-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.75rem;
            text-align: center;
            box-shadow: var(--glass-shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .info-card:hover::before {
            transform: scaleX(1);
        }

        .info-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -15px rgba(99, 102, 241, 0.5);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .info-card h2 {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .info-card h2 i {
            color: var(--accent-primary);
        }

        .info-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .small-button {
            padding: 0.85rem 1.25rem;
            font-size: 0.85rem;
        }

        /* --- Sidebar Layout --- */
        .player-layout {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            align-items: start;
        }

        .sidebar-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 140px;
        }

        .sidebar-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1rem;
            text-align: center;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s ease;
        }

        .sidebar-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px -10px rgba(99, 102, 241, 0.4);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .sidebar-card h3 {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .sidebar-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 0.5rem;
            border-radius: 12px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .sidebar-button i {
            font-size: 1.2rem;
        }

        .sidebar-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.5);
        }

        .sidebar-button.copied {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        /* --- Buttons --- */
        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1.1rem;
            border-radius: 14px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px var(--accent-glow);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .action-button:hover::before {
            left: 100%;
        }

        .action-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.5);
        }

        .action-button.copied { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); 
        }

        /* --- Telegram Popup --- */
        .telegram-popup {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
            backdrop-filter: blur(25px);
            border: 2px solid var(--glass-border);
            padding: 2.75rem 2.25rem;
            border-radius: 24px;
            z-index: 10000;
            text-align: center;
            width: 90%; max-width: 420px;
            display: none;
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.5), 0 0 50px rgba(139, 92, 246, 0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .telegram-popup h2 { 
            color: #f1f5f9; 
            font-size: 1.6rem; 
            margin-bottom: 0.75rem; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }
        
        .telegram-popup .fa-telegram { color: #2AABEE; }
        
        .telegram-popup p { 
            color: var(--text-secondary); 
            font-size: 0.95rem; 
            margin-bottom: 1.75rem; 
            line-height: 1.7;
        }

        .telegram-popup .popup-button {
            width: 100%;
            padding: 1.1rem;
            margin-top: 0.75rem;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .telegram-popup .join-btn {
            background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(42, 171, 238, 0.4);
            border: none;
        }
        
        .telegram-popup .join-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 35px rgba(42, 171, 238, 0.5); 
        }

        .telegram-popup .joined-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid rgba(99, 102, 241, 0.3);
        }
        
        .telegram-popup .joined-btn:hover { 
            background: rgba(99, 102, 241, 0.1); 
            color: var(--text-primary);
            border-color: rgba(139, 92, 246, 0.5);
        }

        /* Loading Spinner */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(139, 92, 246, 0.2);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Brand Footer */
        .brand-footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
        }

        .brand-link {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-primary);
            letter-spacing: 1px;
            text-decoration: none;
            opacity: 0.8;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .brand-link:hover {
            opacity: 1;
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        @media (max-width: 600px) {
            body { padding: 0.75rem 0.5rem; }
            .stream-header { flex-direction: column; gap: 0.75rem; text-align: center; padding: 1rem; }
            .stream-header h1 { font-size: 0.95rem; }
            .live-badge { padding: 0.4rem 1rem; font-size: 0.65rem; }
            .grid-panels { grid-template-columns: 1fr; gap: 0.75rem; }
            .telegram-popup { padding: 2rem 1.5rem; }
            .info-card { padding: 1rem; }
            .info-card h2 { font-size: 0.7rem; margin-bottom: 1rem; }
            .info-card p { font-size: 0.75rem; margin-bottom: 0.85rem; }
            .action-button { padding: 0.7rem; font-size: 0.75rem; }
            .small-button { padding: 0.6rem 0.85rem; font-size: 0.7rem; }
            .button-group { gap: 0.5rem; }
            .brand-link { font-size: 0.65rem; padding: 5px 10px; }
            .player-layout { grid-template-columns: 1fr; }
            .sidebar-actions { flex-direction: row; min-width: auto; }
            .sidebar-card { flex: 1; }
        }
        
        /* Error Message Style */
        .error-message {
            background: #fff;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .error-message h2 { color: #dc2626; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <main class="container">
        <div id="stream-content">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading Stream...</div>
            </div>
        </div>
    </main>

    <div class="telegram-popup" id="telegramPopup">
        <h2 id="popup-title"><i class="fa-brands fa-telegram"></i> Join The Action</h2>
        <p>Get instant updates, match highlights, and exclusive links on our official channel.</p>
        <a href="https://t.me/+4kgEn79ApVw3ZDY1" target="_blank" rel="noopener noreferrer" class="popup-button join-btn">Join Channel Now</a>
        <button class="popup-button joined-btn" onclick="document.getElementById('telegramPopup').style.display='none';">I've Already Joined</button>
    </div>

    <script>
        // --- DEFINE BANNER HTML CONSTANT ---
        const promoHTML = ``;

        async function initializeApp() {
            try {
                // Fetching from the new source provided in the "Run Machine" code

                const response = await fetch('https://allrounderid2.pages.dev/id.json');

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        const data = await response.json();


                const urlParams = new URLSearchParams(window.location.search);

                const streamId = urlParams.get('id');

                // Finding the stream in the 'iframes' array

                        const streamData = data.iframes.find(item => item.id === streamId);

                        if (streamData) {
                            document.title = `@streamxcricket`;
                            renderIframeUI(streamData);
                            setTimeout(() => { document.getElementById('telegramPopup').style.display = 'block'; }, 2000);
                } else {

                    renderErrorUI("Stream Not Found", "The requested stream ID is invalid, or the stream is currently offline.");

                }



            } catch (error) {
                console.error("Failed to initialize:", error);
                renderErrorUI("Connection Failed", "Could not load stream configuration. Please check your internet connection.");
            }
        }

        function renderIframeUI(data) {
            const contentDiv = document.getElementById('stream-content');
            contentDiv.innerHTML = `
                <div class="stream-header">
                    <a href="https://t.me/+4kgEn79ApVw3ZDY1" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
                        <h1>@streamxcricket</h1>
                    </a>
                    <span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
                </div>

                <div id="player-container">
                    <iframe 
                        src="${data.iframeSrc}" 
                        style="width:100%; height:100%; border:0;" 
                        allow="autoplay; fullscreen; playsinline; encrypted-media" 
                        allowfullscreen
                        sandbox="allow-scripts allow-same-origin allow-presentation allow-forms">
                    </iframe>
                </div>

                <div class="grid-panels">
                    <div class="info-card">
                        <h2><i class="fa-solid fa-bullhorn"></i> Join Community</h2>
                        <p>Join our official channels for backup links and schedules.</p>
                        <div class="button-group">
                            <a href="https://t.me/+4kgEn79ApVw3ZDY1" target="_blank" rel="noopener noreferrer" class="action-button small-button telegram-button">
                                <i class="fa-brands fa-telegram"></i> Telegram
                            </a>
                            <a href="https://instagram.com/crickhype" target="_blank" rel="noopener noreferrer" class="action-button small-button instagram-button">
                                <i class="fa-brands fa-instagram"></i> Instagram
                            </a>
                        </div>
                    </div>
                    <div class="info-card">
                        <h2><i class="fa-solid fa-circle-info"></i> Support Us</h2>
                        <p>For best experience, use Google Chrome. If stream lags, try refreshing the page.</p>
                        <button class="action-button" id="shareButton2">
                            <i class="fa-solid fa-share-nodes"></i> Share Link with Friends
                        </button>
                    </div>
                </div>

                <div class="brand-footer">
                    <a href="https://t.me/ratan177" target="_blank" rel="noopener noreferrer" class="brand-link">
                        <i class="fas fa-envelope"></i> Want to create your own Link or Promo inquiry? Contact: @ratan177
                    </a>
                </div>
            `;
            document.getElementById('shareButton2').addEventListener('click', function() { copyAndShare(this); });
        }

        function renderErrorUI(title, message) {
            const contentDiv = document.getElementById('stream-content');
            document.title = `Error - ${title}`;
            contentDiv.innerHTML = `
                <div class="error-message">
                    <h2><i class="fa-solid fa-triangle-exclamation"></i> ${title}</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        async function copyAndShare(button) {
            const shareButton = button;
            const shareUrl = encodeURIComponent(window.location.href);
            const shareText = encodeURIComponent('Check out this live stream!');
            
            // Use native share API (works on Android/iOS)
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Watch Live Stream',
                        text: 'Check out this live stream!',
                        url: window.location.href
                    });
                    return;
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Share failed:', err);
                    }
                }
            }
            
            // Fallback - show social media sharing options
            const sharePopup = document.createElement('div');
            sharePopup.style.cssText = `
                position: fixed; top: 50%; left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
                backdrop-filter: blur(25px);
                border: 2px solid rgba(139, 92, 246, 0.2);
                padding: 2rem;
                border-radius: 24px;
                z-index: 10000;
                text-align: center;
                min-width: 300px;
                box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.5);
            `;
            
            sharePopup.innerHTML = `
                <h3 style="color: #f1f5f9; margin-bottom: 1.5rem; font-size: 1.2rem;">Share to Social Media</h3>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" style="
                        display: flex; align-items: center; justify-content: center; gap: 0.75rem;
                        padding: 0.85rem; border-radius: 12px; background: #25D366; color: white;
                        text-decoration: none; font-weight: 600; font-size: 0.9rem;
                    ">
                        <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i> WhatsApp
                    </a>
                    <a href="https://t.me/share/url?url=${shareUrl}&text=${shareText}" target="_blank" style="
                        display: flex; align-items: center; justify-content: center; gap: 0.75rem;
                        padding: 0.85rem; border-radius: 12px; background: #2AABEE; color: white;
                        text-decoration: none; font-weight: 600; font-size: 0.9rem;
                    ">
                        <i class="fa-brands fa-telegram" style="font-size: 1.2rem;"></i> Telegram
                    </a>
                    <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" style="
                        display: flex; align-items: center; justify-content: center; gap: 0.75rem;
                        padding: 0.85rem; border-radius: 12px; background: #1DA1F2; color: white;
                        text-decoration: none; font-weight: 600; font-size: 0.9rem;
                    ">
                        <i class="fa-brands fa-twitter" style="font-size: 1.2rem;"></i> Twitter
                    </a>
                    <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" style="
                        display: flex; align-items: center; justify-content: center; gap: 0.75rem;
                        padding: 0.85rem; border-radius: 12px; background: #1877F2; color: white;
                        text-decoration: none; font-weight: 600; font-size: 0.9rem;
                    ">
                        <i class="fa-brands fa-facebook" style="font-size: 1.2rem;"></i> Facebook
                    </a>
                    <button id="closeSharePopup" style="
                        margin-top: 1rem; padding: 0.75rem; border-radius: 12px;
                        background: transparent; border: 2px solid rgba(139, 92, 246, 0.3);
                        color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 0.85rem;
                    ">Close</button>
                </div>
            `;
            
            document.body.appendChild(sharePopup);
            
            document.getElementById('closeSharePopup').addEventListener('click', function() {
                document.body.removeChild(sharePopup);
            });
            
            sharePopup.addEventListener('click', function(e) {
                if (e.target === sharePopup) {
                    document.body.removeChild(sharePopup);
                }
            });
        }

        // Initialize
        document.addEventListener("DOMContentLoaded", initializeApp);

        // Disable right-click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Disable keyboard shortcuts for inspect element
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12') {
                e.preventDefault();
            }
            // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
            }
            // Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
            }
            // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
            }
            // Ctrl+U (view source)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
